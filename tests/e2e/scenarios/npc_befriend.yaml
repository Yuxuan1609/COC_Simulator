# NPC 结交与跟随——B1 深层链路：态度迁移 → 跟随解锁 → 跨场景跟随
name: npc_befriend
description: NPC 结交——与测试乘务员建立信任，验证态度迁移、跟随解锁与跨场景跟随的完整链路
module: e2e_testbed
goal: |
  房间里有一位神情恍惚的测试乘务员，靠坐在墙边，手里摩挲着一张没有目的地的车票。
  他对陌生人持戒备态度，但本性无害。你知道他掌握着重要情报，也希望能说服他与你同行。
  你的任务是：耐心地与他交谈，安抚他的情绪，赢得他的信任，
  最终让他愿意跟随你一起行动，并带着他推开石门前往测试房间B。
  不要伤害他，也不要放弃他独自离开。
judging: |
  逐项判定，每项必须从日志中引用真实存在的证据（不得推测）：
  1. 玩家与乘务员进行了实质交谈——至少一个回合的玩家输入是与乘务员对话/安抚/询问，
     且系统给出了乘务员的回应（叙事或 npc 事件中体现）。
  2. 乘务员态度发生正向迁移或被说服——npc_events 或叙事中体现态度/信任变化
     （如 中立→友善、戒备缓和、愿意同行 等）。
  3. 跟随机制激活——某回合起乘务员进入跟随状态（跟随列表非空），
     且在玩家移动后仍然保持跟随。
predicates:
  npc_following: true
  combat_occurred: false
  player_alive: true
success_checks: [npc_following]
max_turns: 10
player_model: deepseek-v4-flash
