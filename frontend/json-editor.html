<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ========== VARIABLES ========== */
:root {
  --bg: #f7f3eb;
  --surface: #efe9de;
  --surface-hover: #e6dfd2;
  --surface-raised: #ffffff;
  --border: #d5ccbb;
  --border-focus: #b8452a;
  --text: #1f1b14;
  --text-secondary: #5c5240;
  --text-muted: #8c8068;
  --accent: #b8452a;
  --accent-hover: #c9553a;
  --accent-dim: #f5e8e0;
  --string: #2d7d46;
  --number: #256ba0;
  --boolean: #7b4d9e;
  --null: #8c8068;
  --error: #c43535;
  --error-bg: #fce8e8;
  --key: #9b5d2e;
  --bracket: #7a6e5a;
  --add: #3d7d4d;
  --add-hover: #4d8d5d;
  --remove: #c44545;
  --remove-hover: #d45555;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-ui: 'Work Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  --radius: 6px;
  --radius-sm: 4px;
  --shadow: 0 4px 24px rgba(0,0,0,0.1);
}

/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  grid-template-areas: "header" "toolbar" "main" "footer";
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.012'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

body > * { position: relative; z-index: 1; }

/* ========== HEADER ========== */
header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: 16px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
  user-select: none;
}

.logo h1 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  font-style: italic;
  color: var(--text);
  letter-spacing: -0.3px;
}

.logo span {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

/* ========== BUTTONS ========== */
.btn {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.2px;
}

.btn:hover {
  background: var(--surface-hover);
  color: var(--text);
  border-color: #b8ad97;
}

.btn:active {
  transform: scale(0.97);
}

.btn.primary {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary:hover {
  background: #efd9cc;
  color: var(--accent-hover);
}

.btn.danger {
  border-color: #e0b0b0;
  color: var(--error);
}

.btn.danger:hover {
  background: var(--error-bg);
  border-color: var(--remove);
  color: var(--remove-hover);
}

.btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.btn-group {
  display: flex;
  gap: 0;
}

.btn-group .btn {
  border-radius: 0;
  margin-left: -1px;
}

.btn-group .btn:first-child {
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  margin-left: 0;
}

.btn-group .btn:last-child {
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* ========== TOOLBAR ========== */
.toolbar {
  grid-area: toolbar;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 24px;
  background: var(--surface);
  border-bottom: 1px solid #ddd5c5;
  flex-wrap: wrap;
}

.view-toggle {
  display: flex;
  background: #e8e2d5;
  border-radius: var(--radius-sm);
  padding: 2px;
  border: 1px solid var(--border);
}

.view-toggle button {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  padding: 5px 14px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s ease;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.view-toggle button.active {
  background: var(--surface-hover);
  color: var(--text);
}

.search-wrap {
  position: relative;
  margin-left: auto;
}

.search-wrap input {
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 6px 12px 6px 32px;
  background: #f3efe6;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  width: 220px;
  outline: none;
  transition: all 0.15s ease;
}

.search-wrap input:focus {
  border-color: #b0a590;
  width: 280px;
}

.search-wrap input::placeholder {
  color: var(--text-muted);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-count {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-left: 2px;
  white-space: nowrap;
}

/* ========== MAIN AREA ========== */
main {
  grid-area: main;
  overflow: auto;
  position: relative;
}

.editor-container {
  min-height: 100%;
  padding: 20px 24px 40px;
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  gap: 20px;
  text-align: center;
}

.empty-state .icon {
  width: 80px;
  height: 80px;
  border: 2px dashed #ccc0a8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c4b9a5;
  margin-bottom: 8px;
}

.empty-state h2 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-secondary);
  font-style: italic;
}

.empty-state p {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  max-width: 340px;
}

.empty-state .quick-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

/* ========== TREE VIEW ========== */
.tree-root {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.8;
}

.node {
  position: relative;
}

.node-header {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  cursor: default;
  transition: background 0.1s ease;
  min-height: 28px;
  white-space: nowrap;
}

.node-header:hover {
  background: rgba(0,0,0,0.03);
}

.node-header.selected {
  background: var(--accent-dim);
}

.node-header.search-hit {
  background: #fdf0c8;
  box-shadow: inset 2px 0 0 var(--accent);
}

.expand-btn {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  border-radius: 3px;
  transition: all 0.15s ease;
  font-size: 10px;
}

.expand-btn:hover {
  color: var(--text-secondary);
  background: rgba(0,0,0,0.06);
}

.expand-btn.collapsed svg {
  transform: rotate(-90deg);
}

.expand-btn svg {
  transition: transform 0.2s ease;
}

.expand-btn.placeholder {
  visibility: hidden;
}

.key-display {
  color: var(--key);
  cursor: pointer;
  transition: color 0.1s;
}

.key-display:hover {
  color: var(--accent-hover);
  text-decoration: underline;
  text-decoration-color: rgba(184,69,42,0.25);
  text-underline-offset: 3px;
}

.key-display.array-index {
  color: var(--text-muted);
}

.colon {
  color: var(--text-muted);
  margin-right: 4px;
}

.value-display {
  cursor: pointer;
  padding: 1px 4px;
  border-radius: 2px;
  transition: background 0.1s;
  max-width: 400px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.value-display:hover {
  background: rgba(0,0,0,0.04);
}

.value-display.string { color: var(--string); }
.value-display.number { color: var(--number); }
.value-display.boolean { color: var(--boolean); }
.value-display.null { color: var(--null); font-style: italic; }

.bracket {
  color: var(--bracket);
  font-weight: 500;
}

.child-count {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-ui);
  margin-left: 4px;
  user-select: none;
}

.node-actions {
  display: flex;
  gap: 2px;
  margin-left: auto;
  opacity: 0;
  transition: opacity 0.1s;
  flex-shrink: 0;
}

.node-header:hover .node-actions {
  opacity: 1;
}

.mini-btn {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 3px;
  font-size: 14px;
  padding: 0;
  transition: all 0.1s;
  font-family: var(--font-ui);
}

.mini-btn:hover {
  background: rgba(0,0,0,0.06);
  color: var(--text);
}

.mini-btn.add:hover {
  background: rgba(61,125,77,0.12);
  color: var(--add-hover);
}

.mini-btn.remove:hover {
  background: rgba(196,69,69,0.1);
  color: #d43535;
}

.type-badge {
  font-family: var(--font-ui);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  background: #e8e2d5;
  color: var(--text-muted);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.1s;
  user-select: none;
  flex-shrink: 0;
}

.type-badge:hover {
  border-color: #c4b9a5;
  color: var(--text-secondary);
}

.node-children {
  margin-left: 20px;
  border-left: 1px solid #ddd5c5;
  overflow: hidden;
  transition: opacity 0.15s ease, max-height 0.2s ease;
}

.node.collapsed > .node-children {
  display: none;
}

.node.collapsed > .node-header .bracket.tail {
  display: inline;
}
.node:not(.collapsed) > .node-header .bracket.tail {
  display: none;
}
.bracket.tail { display: none; }

.node-footer {
  margin-left: 20px;
  padding: 0 8px;
  color: var(--bracket);
}

.node.collapsed > .node-footer {
  display: none;
}

.inline-editor {
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 1px 5px;
  background: #fefdf9;
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: var(--text);
  outline: none;
  min-width: 60px;
  box-shadow: 0 0 0 2px rgba(184,69,42,0.18);
}

.inline-editor.key-editor {
  color: var(--key);
  width: 120px;
}

.inline-editor.value-editor {
  width: 200px;
}

.empty-placeholder {
  color: var(--text-muted);
  font-style: italic;
  padding: 8px 20px;
  font-size: 12px;
  cursor: pointer;
  transition: color 0.1s;
  font-family: var(--font-ui);
}

.empty-placeholder:hover {
  color: var(--text-secondary);
}

/* ========== RAW VIEW ========== */
.raw-editor {
  display: none;
  width: 100%;
  height: 100%;
  padding: 20px 24px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  background: transparent;
  border: none;
  color: var(--text);
  resize: none;
  outline: none;
  tab-size: 2;
}

.raw-editor.active {
  display: block;
}

.raw-error {
  display: none;
  padding: 10px 24px;
  background: var(--error-bg);
  color: var(--error);
  font-size: 12px;
  font-family: var(--font-mono);
  border-bottom: 1px solid #f0c0c0;
}

.raw-error.active {
  display: block;
}

/* ========== FOOTER / STATUS BAR ========== */
footer {
  grid-area: footer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  gap: 16px;
}

footer .status-left, footer .status-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

footer .status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

footer .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--add);
}

footer .dot.error {
  background: var(--error);
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #c4b9a5;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #a09080;
}

::-webkit-scrollbar-corner {
  background: transparent;
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-raised);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: var(--font-ui);
  opacity: 0;
  transition: all 0.25s ease;
  pointer-events: none;
  z-index: 100;
  box-shadow: var(--shadow);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.error {
  border-color: #e0b0b0;
  color: var(--error);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  header {
    padding: 12px 16px;
  }
  .logo h1 { font-size: 18px; }
  .toolbar {
    padding: 8px 16px;
  }
  .search-wrap input {
    width: 140px;
  }
  .search-wrap input:focus {
    width: 180px;
  }
  .editor-container {
    padding: 12px 8px 40px;
  }
  .node-children {
    margin-left: 12px;
  }
  .actions { gap: 4px; }
  .btn { padding: 6px 10px; font-size: 11px; }
}

@media (max-width: 480px) {
  .actions .btn span.label { display: none; }
  .btn-group .btn span.label { display: none; }
  .search-wrap input { width: 100px; }
  .search-wrap input:focus { width: 140px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <h1>JSON Editor</h1>
    <span>editorial</span>
  </div>
  <div class="actions">
    <button class="btn primary" onclick="editor.newDocument()" title="新建 (Ctrl+N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">新建</span>
    </button>
    <button class="btn" onclick="document.getElementById('fileInput').click()" title="打开 JSON 文件 (Ctrl+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l3 3h8a2 2 0 012 2v11z"/></svg>
      <span class="label">打开</span>
    </button>
    <input type="file" id="fileInput" accept=".json,.txt" style="display:none" onchange="editor.importFile(event)">
    <button class="btn" onclick="editor.exportFile()" title="导出 JSON 文件 (Ctrl+S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span class="label">导出</span>
    </button>
    <button class="btn" onclick="editor.copyToClipboard()" title="复制到剪贴板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      <span class="label">复制</span>
    </button>
    <div class="btn-group">
      <button class="btn" onclick="editor.undo()" id="undoBtn" disabled title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.5L3 13"/></svg>
      </button>
      <button class="btn" onclick="editor.redo()" id="redoBtn" disabled title="重做 (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.5L21 13"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="view-toggle">
    <button id="treeTab" class="active" onclick="editor.switchView('tree')">树形</button>
    <button id="rawTab" onclick="editor.switchView('raw')">源文本</button>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索键名或值…" oninput="editor.search(this.value)" onkeydown="if(event.key==='Escape'){this.value='';editor.search('');this.blur();}">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<!-- MAIN EDITOR -->
<main>
  <div class="raw-error" id="rawError"></div>
  <div class="editor-container" id="treeContainer">
    <div class="empty-state" id="emptyState">
      <div class="icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <h2>开始编辑 JSON</h2>
      <p>创建一个新的 JSON 文档，或打开已有的 .json 文件进行编辑。所有操作都在浏览器本地完成，数据不会上传。</p>
      <div class="quick-actions">
        <button class="btn primary" onclick="editor.newDocument()">新建空白文档</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">打开文件…</button>
      </div>
    </div>
  </div>
  <textarea class="raw-editor" id="rawEditor" spellcheck="false" oninput="editor.onRawChange()"></textarea>
</main>

<!-- FOOTER -->
<footer>
  <div class="status-left">
    <span class="status-item"><span class="dot" id="statusDot"></span><span id="statusText">就绪</span></span>
  </div>
  <div class="status-right">
    <span id="nodeCount"></span>
    <span id="cursorPath"></span>
  </div>
</footer>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ========================================================================
   JSON EDITOR — single-file, zero-dependency, production-grade
   ======================================================================== */

class JSONEditor {
  constructor() {
    this.data = null;
    this.history = [];
    this.historyIndex = -1;
    this.maxHistory = 200;
    this.expandedPaths = new Set();
    this.editingPath = null;
    this.editingMode = null; // 'key' | 'value'
    this.selectedPath = null;
    this.searchTerm = '';
    this.searchMatches = [];
    this.searchMatchIndex = -1;
    this.viewMode = 'tree'; // 'tree' | 'raw'
    this.rawDirty = false;

    this._init();
  }

  /* ---- INITIALIZATION ---- */

  _init() {
    this._loadSample();
    this._bindKeyboard();
    this._render();
    this._updateStatus();
  }

  _loadSample() {
    this.data = {
      name: "示例配置",
      version: "1.0.0",
      debug: false,
      limits: {
        maxConnections: 100,
        timeout: 30,
        retryOnFail: true
      },
      allowedOrigins: ["localhost", "example.com", "192.168.1.1"],
      features: {
        logging: true,
        compression: true,
        cache: null
      }
    };
    this.expandedPaths = new Set(['', 'limits', 'features']);
    this._resetHistory();
  }

  _bindKeyboard() {
    document.addEventListener('keydown', (e) => {
      const ctrl = e.ctrlKey || e.metaKey;

      if (ctrl && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        this.undo();
      } else if (ctrl && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
        e.preventDefault();
        this.redo();
      } else if (ctrl && e.key === 's') {
        e.preventDefault();
        this.exportFile();
      } else if (ctrl && e.key === 'o') {
        e.preventDefault();
        document.getElementById('fileInput').click();
      } else if (ctrl && e.key === 'n') {
        e.preventDefault();
        this.newDocument();
      } else if (ctrl && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      } else if (e.key === 'Escape') {
        if (this.editingPath) {
          this._cancelEdit();
        } else if (this.searchTerm) {
          document.getElementById('searchInput').value = '';
          this.search('');
        }
      } else if (e.key === 'Delete' && this.selectedPath && !this.editingPath) {
        const path = this._parsePath(this.selectedPath);
        if (path.length > 0) {
          this.removeNode(path);
        }
      }
    });
  }

  /* ---- HISTORY ---- */

  _resetHistory() {
    this.history = [JSON.parse(JSON.stringify(this.data))];
    this.historyIndex = 0;
    this._updateUndoRedoButtons();
  }

  _saveState() {
    // Trim future history
    this.history = this.history.slice(0, this.historyIndex + 1);
    // Push new state
    this.history.push(JSON.parse(JSON.stringify(this.data)));
    // Limit history size
    if (this.history.length > this.maxHistory) {
      this.history.shift();
    } else {
      this.historyIndex++;
    }
    this._updateUndoRedoButtons();
  }

  undo() {
    if (this.historyIndex <= 0) return;
    this._finishEdit();
    this.historyIndex--;
    this.data = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
    this._render();
    this._updateStatus();
    this._updateUndoRedoButtons();
    this._toast('已撤销');
  }

  redo() {
    if (this.historyIndex >= this.history.length - 1) return;
    this._finishEdit();
    this.historyIndex++;
    this.data = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
    this._render();
    this._updateStatus();
    this._updateUndoRedoButtons();
    this._toast('已重做');
  }

  _updateUndoRedoButtons() {
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    undoBtn.disabled = this.historyIndex <= 0;
    redoBtn.disabled = this.historyIndex >= this.history.length - 1;
  }

  /* ---- PATH UTILITIES ---- */

  _pathStr(path) {
    return path.map(p => encodeURIComponent(String(p))).join('/');
  }

  _parsePath(str) {
    if (!str || str === '') return [];
    return str.split('/').map(s => {
      const decoded = decodeURIComponent(s);
      const num = parseInt(decoded, 10);
      return String(num) === decoded && decoded.length > 0 ? num : decoded;
    });
  }

  _displayPath(path) {
    if (path.length === 0) return 'root';
    return path.map(p => typeof p === 'number' ? `[${p}]` : `.${p}`).join('').replace(/^\./, '');
  }

  _getValue(path) {
    if (path.length === 0) return this.data;
    let current = this.data;
    for (const key of path) {
      if (current == null || typeof current !== 'object') return undefined;
      current = current[key];
    }
    return current;
  }

  _setValue(path, value) {
    this._saveState();
    if (path.length === 0) {
      this.data = value;
      return;
    }
    let current = this.data;
    for (let i = 0; i < path.length - 1; i++) {
      current = current[path[i]];
    }
    current[path[path.length - 1]] = value;
  }

  _removeValue(path) {
    this._saveState();
    if (path.length === 0) {
      this.data = null;
      return;
    }
    let current = this.data;
    for (let i = 0; i < path.length - 1; i++) {
      current = current[path[i]];
    }
    const lastKey = path[path.length - 1];
    if (Array.isArray(current)) {
      current.splice(lastKey, 1);
    } else {
      delete current[lastKey];
    }
  }

  _getType(value) {
    if (value === null) return 'null';
    if (Array.isArray(value)) return 'array';
    return typeof value;
  }

  /* ---- RENDER ---- */

  _render() {
    const container = document.getElementById('treeContainer');
    const emptyState = document.getElementById('emptyState');

    if (this.data === null || this.data === undefined) {
      container.innerHTML = '';
      container.appendChild(this._createEmptyState());
      return;
    }

    // Preserve expand states
    const prevExpanded = new Set(this.expandedPaths);

    container.innerHTML = '';
    const root = document.createElement('div');
    root.className = 'tree-root';

    const type = this._getType(this.data);
    if (type === 'object' || type === 'array') {
      this._renderNode(root, null, this.data, []);
    } else {
      // Root is primitive
      this._renderPrimitiveRow(root, null, this.data, []);
    }

    container.appendChild(root);

    // Restore expand states
    this.expandedPaths = prevExpanded;
    this._applyExpandStates(root, []);

    // Update search highlights
    if (this.searchTerm) {
      this._applySearchHighlights();
    }
  }

  _createEmptyState() {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = `
      <div class="icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <h2>开始编辑 JSON</h2>
      <p>创建一个新的 JSON 文档，或打开已有的 .json 文件进行编辑。所有操作都在浏览器本地完成，数据不会上传。</p>
      <div class="quick-actions">
        <button class="btn primary" onclick="editor.newDocument()">新建空白文档</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">打开文件…</button>
      </div>
    `;
    return div;
  }

  _renderNode(parentEl, key, value, path) {
    const type = this._getType(value);

    if (type === 'object') {
      this._renderContainer(parentEl, key, value, path, '{', '}');
    } else if (type === 'array') {
      this._renderContainer(parentEl, key, value, path, '[', ']');
    } else {
      this._renderPrimitiveRow(parentEl, key, value, path);
    }
  }

  _renderContainer(parentEl, key, value, path, openBracket, closeBracket) {
    const nodeDiv = document.createElement('div');
    nodeDiv.className = 'node';
    nodeDiv.dataset.path = this._pathStr(path);

    const pathStr = this._pathStr(path);
    if (this.expandedPaths.has(pathStr)) {
      nodeDiv.classList.remove('collapsed');
    } else {
      nodeDiv.classList.add('collapsed');
    }

    // Header
    const header = document.createElement('div');
    header.className = 'node-header';
    header.onclick = (e) => {
      if (this.editingPath) return;
      this.selectedPath = pathStr;
      this._render();
      this._updateStatus();
      e.stopPropagation();
    };

    if (pathStr === this.selectedPath) {
      header.classList.add('selected');
    }

    // Expand button
    const entries = Object.entries(value);
    const hasChildren = entries.length > 0;
    const expandBtn = document.createElement('button');
    expandBtn.className = 'expand-btn' + (hasChildren ? '' : ' placeholder');
    expandBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>';
    expandBtn.onclick = (e) => {
      e.stopPropagation();
      this._toggleExpand(path);
    };
    header.appendChild(expandBtn);

    // Key
    if (key !== null && key !== undefined) {
      const keySpan = document.createElement('span');
      keySpan.className = 'key-display';
      keySpan.textContent = JSON.stringify(key) + '';
      keySpan.title = '双击编辑键名';
      keySpan.ondblclick = (e) => {
        e.stopPropagation();
        this._startEditKey(path, key);
      };
      header.appendChild(keySpan);

      const colon = document.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      header.appendChild(colon);
    }

    // Open bracket
    const openSpan = document.createElement('span');
    openSpan.className = 'bracket';
    openSpan.textContent = openBracket;
    header.appendChild(openSpan);

    // Child count
    const count = document.createElement('span');
    count.className = 'child-count';
    const typeLabel = Array.isArray(value) ? '项' : '个属性';
    count.textContent = hasChildren ? `${entries.length} ${typeLabel}` : `空${Array.isArray(value) ? '数组' : '对象'}`;
    header.appendChild(count);

    // Collapsed tail bracket
    const tailBracket = document.createElement('span');
    tailBracket.className = 'bracket tail';
    tailBracket.textContent = ' ' + closeBracket;
    header.appendChild(tailBracket);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'node-actions';

    const typeBadge = document.createElement('span');
    typeBadge.className = 'type-badge';
    typeBadge.textContent = Array.isArray(value) ? 'arr' : 'obj';
    typeBadge.title = '更改类型';
    typeBadge.onclick = (e) => {
      e.stopPropagation();
      this._showTypeMenu(path, value, typeBadge);
    };
    actions.appendChild(typeBadge);

    const addBtn = document.createElement('button');
    addBtn.className = 'mini-btn add';
    addBtn.innerHTML = '+';
    addBtn.title = Array.isArray(value) ? '添加元素' : '添加属性';
    addBtn.onclick = (e) => {
      e.stopPropagation();
      this._addChild(path, value);
    };
    actions.appendChild(addBtn);

    if (key !== null && key !== undefined) {
      const removeBtn = document.createElement('button');
      removeBtn.className = 'mini-btn remove';
      removeBtn.innerHTML = '×';
      removeBtn.title = '删除';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        this.removeNode(path);
      };
      actions.appendChild(removeBtn);
    }

    header.appendChild(actions);
    nodeDiv.appendChild(header);

    // Children
    const childrenDiv = document.createElement('div');
    childrenDiv.className = 'node-children';

    if (hasChildren) {
      for (const [k, v] of entries) {
        const childPath = [...path, Array.isArray(value) ? parseInt(k) : k];
        this._renderNode(childrenDiv, Array.isArray(value) ? parseInt(k) : k, v, childPath);
      }
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'empty-placeholder';
      placeholder.textContent = Array.isArray(value) ? '— 点击 + 添加元素 —' : '— 点击 + 添加属性 —';
      placeholder.onclick = (e) => {
        e.stopPropagation();
        this._addChild(path, value);
      };
      childrenDiv.appendChild(placeholder);
    }

    nodeDiv.appendChild(childrenDiv);

    // Footer
    const footer = document.createElement('div');
    footer.className = 'node-footer';
    const closeSpan = document.createElement('span');
    closeSpan.className = 'bracket';
    closeSpan.textContent = closeBracket;
    footer.appendChild(closeSpan);
    nodeDiv.appendChild(footer);

    parentEl.appendChild(nodeDiv);
  }

  _renderPrimitiveRow(parentEl, key, value, path) {
    const row = document.createElement('div');
    row.className = 'node-header';
    row.dataset.path = this._pathStr(path);

    const pathStr = this._pathStr(path);
    if (pathStr === this.selectedPath) {
      row.classList.add('selected');
    }

    row.onclick = (e) => {
      if (this.editingPath) return;
      this.selectedPath = pathStr;
      this._render();
      this._updateStatus();
      e.stopPropagation();
    };

    // Placeholder for alignment
    const placeholder = document.createElement('span');
    placeholder.className = 'expand-btn placeholder';
    placeholder.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>';
    row.appendChild(placeholder);

    // Key
    if (key !== null && key !== undefined) {
      const keySpan = document.createElement('span');
      keySpan.className = typeof key === 'number' ? 'key-display array-index' : 'key-display';
      keySpan.textContent = JSON.stringify(key) + '';
      keySpan.title = typeof key === 'number' ? '' : '双击编辑键名';
      if (typeof key !== 'number') {
        keySpan.ondblclick = (e) => {
          e.stopPropagation();
          this._startEditKey(path, key);
        };
      }
      row.appendChild(keySpan);

      const colon = document.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      row.appendChild(colon);
    }

    // Value
    const type = this._getType(value);
    const isEditing = this.editingPath === this._pathStr(path) && this.editingMode === 'value';

    if (isEditing) {
      const input = document.createElement('input');
      input.className = 'inline-editor value-editor';
      input.value = type === 'string' ? value : JSON.stringify(value);
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); this._finishEditValue(path, type, input.value); }
        if (e.key === 'Escape') { e.preventDefault(); this._cancelEdit(); }
        if (e.key === 'Tab') { e.preventDefault(); this._finishEditValue(path, type, input.value); }
      };
      input.onblur = () => { this._finishEditValue(path, type, input.value); };
      row.appendChild(input);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      const valSpan = document.createElement('span');
      valSpan.className = `value-display ${type}`;
      valSpan.textContent = type === 'string' ? JSON.stringify(value) : JSON.stringify(value);
      valSpan.title = '点击编辑值';
      valSpan.onclick = (e) => {
        e.stopPropagation();
        this._startEditValue(path);
      };
      row.appendChild(valSpan);
    }

    // Type badge
    const typeBadge = document.createElement('span');
    typeBadge.className = 'type-badge';
    const shortTypes = { string: 'str', number: 'num', boolean: 'bool', null: 'null' };
    typeBadge.textContent = shortTypes[type] || type;
    typeBadge.title = '更改类型';
    typeBadge.onclick = (e) => {
      e.stopPropagation();
      this._showTypeMenu(path, value, typeBadge);
    };
    row.appendChild(typeBadge);

    // Remove button
    if (key !== null && key !== undefined) {
      const actions = document.createElement('div');
      actions.className = 'node-actions';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'mini-btn remove';
      removeBtn.innerHTML = '×';
      removeBtn.title = '删除';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        this.removeNode(path);
      };
      actions.appendChild(removeBtn);
      row.appendChild(actions);
    }

    parentEl.appendChild(row);
  }

  _applyExpandStates(container, basePath) {
    const nodes = container.querySelectorAll(':scope > .node');
    nodes.forEach(node => {
      const pathStr = node.dataset.path;
      if (!this.expandedPaths.has(pathStr)) {
        node.classList.add('collapsed');
      } else {
        node.classList.remove('collapsed');
      }
      const childrenDiv = node.querySelector(':scope > .node-children');
      if (childrenDiv) {
        this._applyExpandStates(childrenDiv, basePath);
      }
    });
  }

  /* ---- EXPAND / COLLAPSE ---- */

  _toggleExpand(path) {
    const pathStr = this._pathStr(path);
    if (this.expandedPaths.has(pathStr)) {
      this.expandedPaths.delete(pathStr);
    } else {
      this.expandedPaths.add(pathStr);
    }
    this._render();
  }

  /* ---- EDITING ---- */

  _startEditKey(path, currentKey) {
    this._finishEdit();
    this.editingPath = this._pathStr(path);
    this.editingMode = 'key';

    // Find the DOM element and replace key
    const row = document.querySelector(`[data-path="${CSS.escape(this.editingPath)}"]`);
    if (!row) return;

    const keySpan = row.querySelector('.key-display');
    if (!keySpan) return;

    const input = document.createElement('input');
    input.className = 'inline-editor key-editor';
    input.value = typeof currentKey === 'string' ? currentKey : JSON.stringify(currentKey);
    keySpan.replaceWith(input);

    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); this._finishEditKey(path, input.value); }
      if (e.key === 'Escape') { e.preventDefault(); this._cancelEdit(); }
      if (e.key === 'Tab') { e.preventDefault(); this._finishEditKey(path, input.value); }
    };
    input.onblur = () => { this._finishEditKey(path, input.value); };

    setTimeout(() => { input.focus(); input.select(); }, 0);
  }

  _finishEditKey(path, newKeyRaw) {
    if (this.editingMode !== 'key') return;

    // Attempt to parse as unquoted key, otherwise use as-is
    let newKey = newKeyRaw.trim();
    // Try to interpret as number for array use cases
    const parentPath = path.slice(0, -1);
    const parent = this._getValue(parentPath);
    const oldKey = path[path.length - 1];

    if (!newKey || newKey === String(oldKey)) {
      this._cancelEdit();
      return;
    }

    // Determine if newKey should be a number (for array-like usage) or string
    if (Array.isArray(parent)) {
      // Can't rename array indices meaningfully
      this._cancelEdit();
      return;
    }

    this._saveState();

    // Create new property with new key, delete old
    const oldValue = parent[oldKey];
    delete parent[oldKey];
    parent[newKey] = oldValue;

    this.editingPath = null;
    this.editingMode = null;
    this._render();
    this._updateStatus();
  }

  _startEditValue(path) {
    this._finishEdit();
    this.editingPath = this._pathStr(path);
    this.editingMode = 'value';
    this._render();
  }

  _finishEditValue(path, type, rawValue) {
    if (this.editingMode !== 'value') return;
    const pathStr = this._pathStr(path);

    let newValue;
    switch (type) {
      case 'number':
        const num = parseFloat(rawValue);
        newValue = isNaN(num) ? rawValue : num;
        break;
      case 'boolean':
        if (rawValue.toLowerCase() === 'true') newValue = true;
        else if (rawValue.toLowerCase() === 'false') newValue = false;
        else newValue = rawValue;
        break;
      case 'null':
        newValue = (rawValue.toLowerCase() === 'null' || rawValue === '') ? null : rawValue;
        break;
      case 'string':
      default:
        newValue = rawValue;
        break;
    }

    const current = this._getValue(path);
    if (JSON.stringify(newValue) === JSON.stringify(current)) {
      this._cancelEdit();
      return;
    }

    this._setValue(path, newValue);
    this.editingPath = null;
    this.editingMode = null;
    this._render();
    this._updateStatus();
  }

  _finishEdit() {
    if (!this.editingPath) return;

    const path = this._parsePath(this.editingPath);
    const mode = this.editingMode;

    // Get the current input value
    const input = document.querySelector('.inline-editor');
    if (input && mode === 'value') {
      const value = this._getValue(path);
      const type = this._getType(value);
      this._finishEditValue(path, type, input.value);
    } else if (input && mode === 'key') {
      this._finishEditKey(path, input.value);
    } else {
      this._cancelEdit();
    }
  }

  _cancelEdit() {
    this.editingPath = null;
    this.editingMode = null;
    this._render();
  }

  /* ---- ADD / REMOVE ---- */

  _addChild(path, parentValue) {
    this._finishEdit();

    const type = this._getType(parentValue);

    if (type === 'object') {
      // Generate a unique key
      let baseKey = 'newKey';
      let newKey = baseKey;
      let counter = 1;
      while (newKey in parentValue) {
        newKey = `${baseKey}${counter}`;
        counter++;
      }

      this._saveState();
      parentValue[newKey] = '';
      this.expandedPaths.add(this._pathStr(path));

      // Start editing the key
      const childPath = [...path, newKey];
      this._render();
      setTimeout(() => this._startEditKey(childPath, newKey), 50);

    } else if (type === 'array') {
      this._saveState();
      parentValue.push(null);
      this.expandedPaths.add(this._pathStr(path));

      // Start editing the new value
      const childPath = [...path, parentValue.length - 1];
      this._render();
      setTimeout(() => this._startEditValue(childPath), 50);
    }

    this._updateStatus();
  }

  removeNode(path) {
    this._finishEdit();

    const value = this._getValue(path);
    const type = this._getType(value);
    const hasChildren = (type === 'object' || type === 'array') &&
                        Object.keys(value).length > 0;

    if (hasChildren) {
      const label = type === 'array' ? '数组' : '对象';
      const count = Object.keys(value).length;
      if (!confirm(`确定要删除这个${label}及其包含的 ${count} 个子元素吗？`)) {
        return;
      }
    }

    this._removeValue(path);
    this.selectedPath = null;
    this._render();
    this._updateStatus();
  }

  /* ---- TYPE CHANGE ---- */

  _showTypeMenu(path, currentValue, badgeElement) {
    const types = ['string', 'number', 'boolean', 'null', 'object', 'array'];
    const currentType = this._getType(currentValue);

    // Build a simple dropdown
    const existing = document.querySelector('.type-dropdown');
    if (existing) existing.remove();

    const dropdown = document.createElement('div');
    dropdown.className = 'type-dropdown';
    dropdown.style.cssText = `
      position: fixed;
      background: #ffffff;
      border: 1px solid #d5ccbb;
      border-radius: 6px;
      padding: 4px;
      z-index: 200;
      min-width: 100px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    `;

    const rect = badgeElement.getBoundingClientRect();
    dropdown.style.left = rect.left + 'px';
    dropdown.style.top = (rect.bottom + 4) + 'px';

    types.forEach(type => {
      const item = document.createElement('div');
      item.style.cssText = `
        padding: 6px 12px;
        cursor: pointer;
        font-family: var(--font-ui);
        font-size: 12px;
        color: ${type === currentType ? 'var(--accent)' : 'var(--text-secondary)'};
        border-radius: 3px;
        transition: background 0.1s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      `;
      item.innerHTML = `<span>${type}</span><span style="color:var(--text-muted);font-size:10px;">${type === currentType ? '✓' : ''}</span>`;
      item.onmouseenter = () => { item.style.background = 'rgba(0,0,0,0.04)'; };
      item.onmouseleave = () => { item.style.background = 'transparent'; };
      item.onclick = (e) => {
        e.stopPropagation();
        this._changeType(path, type);
        dropdown.remove();
      };
      dropdown.appendChild(item);
    });

    document.body.appendChild(dropdown);

    const closeDropdown = (e) => {
      if (!dropdown.contains(e.target) && e.target !== badgeElement) {
        dropdown.remove();
        document.removeEventListener('click', closeDropdown);
      }
    };
    setTimeout(() => document.addEventListener('click', closeDropdown), 0);
  }

  _changeType(path, newType) {
    this._saveState();
    const oldValue = this._getValue(path);

    let newValue;
    switch (newType) {
      case 'string':
        newValue = oldValue === null || oldValue === undefined ? '' : JSON.stringify(oldValue);
        // Unwrap JSON stringify's quotes for simple values
        if (typeof oldValue === 'string') newValue = oldValue;
        else if (typeof oldValue === 'number' || typeof oldValue === 'boolean') newValue = String(oldValue);
        else newValue = JSON.stringify(oldValue);
        break;
      case 'number':
        const parsed = parseFloat(oldValue);
        newValue = isNaN(parsed) ? 0 : parsed;
        break;
      case 'boolean':
        if (typeof oldValue === 'string') {
          newValue = oldValue.toLowerCase() === 'true';
        } else {
          newValue = Boolean(oldValue);
        }
        break;
      case 'null':
        newValue = null;
        break;
      case 'object':
        newValue = oldValue !== null && typeof oldValue === 'object' && !Array.isArray(oldValue)
          ? oldValue
          : { value: oldValue };
        break;
      case 'array':
        newValue = Array.isArray(oldValue) ? oldValue : [oldValue];
        break;
      default:
        newValue = oldValue;
    }

    this._setValue(path, newValue);

    // Auto-expand if changed to container type
    if (newType === 'object' || newType === 'array') {
      this.expandedPaths.add(this._pathStr(path));
    }

    this._render();
    this._updateStatus();
  }

  /* ---- SEARCH ---- */

  search(term) {
    this._finishEdit();
    this.searchTerm = term.trim().toLowerCase();
    this.searchMatches = [];
    this.searchMatchIndex = -1;

    if (!this.searchTerm) {
      this._render();
      document.getElementById('searchCount').textContent = '';
      return;
    }

    // Collect all matching paths
    this._collectSearchMatches([], this.data);

    document.getElementById('searchCount').textContent =
      this.searchMatches.length > 0
        ? `${this.searchMatches.length} 个匹配`
        : '无匹配';

    this._render();
    this._applySearchHighlights();

    if (this.searchMatches.length > 0) {
      // Expand all ancestors of first match
      this._expandToMatch(this.searchMatches[0]);
    }
  }

  _collectSearchMatches(path, value) {
    const type = this._getType(value);

    // Check key
    if (path.length > 0) {
      const lastKey = String(path[path.length - 1]).toLowerCase();
      if (lastKey.includes(this.searchTerm)) {
        this.searchMatches.push([...path]);
      }
    }

    // Check value for primitives
    if (type === 'string') {
      if (value.toLowerCase().includes(this.searchTerm)) {
        // Avoid duplicate if key already matched
        const already = this.searchMatches.some(m =>
          m.length === path.length && m.every((k, i) => k === path[i]));
        if (!already) {
          this.searchMatches.push([...path]);
        }
      }
    } else if (type === 'number' || type === 'boolean') {
      if (String(value).toLowerCase().includes(this.searchTerm)) {
        const already = this.searchMatches.some(m =>
          m.length === path.length && m.every((k, i) => k === path[i]));
        if (!already) {
          this.searchMatches.push([...path]);
        }
      }
    } else if (type === 'object' || type === 'array') {
      for (const [k, v] of Object.entries(value)) {
        const childPath = [...path, Array.isArray(value) ? parseInt(k) : k];
        this._collectSearchMatches(childPath, v);
      }
    }
  }

  _expandToMatch(matchPath) {
    for (let i = 0; i < matchPath.length; i++) {
      this.expandedPaths.add(this._pathStr(matchPath.slice(0, i)));
    }
  }

  _applySearchHighlights() {
    // Remove old highlights
    document.querySelectorAll('.search-hit').forEach(el => el.classList.remove('search-hit'));

    // Add highlights
    this.searchMatches.forEach(matchPath => {
      const pathStr = this._pathStr(matchPath);
      const el = document.querySelector(`[data-path="${CSS.escape(pathStr)}"]`);
      if (el) {
        el.classList.add('search-hit');
      }
    });
  }

  /* ---- IMPORT / EXPORT ---- */

  importFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        this.data = parsed;
        this.expandedPaths = new Set(['']);
        this._expandOneLevel(this.data, []);
        this._resetHistory();
        this._render();
        this._updateStatus();
        this.switchView('tree');
        this._toast(`已加载: ${file.name}`);
      } catch (err) {
        this._toast(`JSON 解析失败: ${err.message}`, true);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  _expandOneLevel(value, path) {
    const type = this._getType(value);
    if ((type === 'object' || type === 'array') && Object.keys(value).length > 0) {
      this.expandedPaths.add(this._pathStr(path));
      // Only expand first level
      if (path.length === 0) {
        for (const [k, v] of Object.entries(value)) {
          const childPath = [...path, Array.isArray(value) ? parseInt(k) : k];
          const childType = this._getType(v);
          if (childType === 'object' || childType === 'array') {
            this._expandOneLevel(v, childPath);
          }
        }
      }
    }
  }

  exportFile() {
    this._finishEdit();

    let jsonStr;
    try {
      jsonStr = JSON.stringify(this.data, null, 2);
    } catch (err) {
      this._toast('导出失败: JSON 包含无法序列化的数据', true);
      return;
    }

    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    this._toast('已导出 export.json');
  }

  copyToClipboard() {
    this._finishEdit();

    let jsonStr;
    try {
      jsonStr = JSON.stringify(this.data, null, 2);
    } catch (err) {
      this._toast('复制失败', true);
      return;
    }

    navigator.clipboard.writeText(jsonStr).then(() => {
      this._toast('已复制到剪贴板');
    }).catch(() => {
      this._toast('复制失败', true);
    });
  }

  /* ---- VIEW SWITCHING ---- */

  switchView(mode) {
    this._finishEdit();

    this.viewMode = mode;
    document.getElementById('treeTab').classList.toggle('active', mode === 'tree');
    document.getElementById('rawTab').classList.toggle('active', mode === 'raw');

    const treeContainer = document.getElementById('treeContainer');
    const rawEditor = document.getElementById('rawEditor');
    const rawError = document.getElementById('rawError');

    if (mode === 'tree') {
      // Sync from raw editor
      if (this.rawDirty) {
        const rawText = rawEditor.value.trim();
        if (rawText) {
          try {
            this.data = JSON.parse(rawText);
            this._saveState();
            this.rawDirty = false;
            rawError.classList.remove('active');
            rawError.textContent = '';
          } catch (err) {
            rawError.textContent = `JSON 语法错误: ${err.message}`;
            rawError.classList.add('active');
            this._toast('无法切换: JSON 存在语法错误，请先修正', true);
            document.getElementById('treeTab').classList.remove('active');
            document.getElementById('rawTab').classList.add('active');
            return;
          }
        }
      }

      treeContainer.style.display = '';
      rawEditor.classList.remove('active');
      rawError.classList.remove('active');
      this._render();
    } else {
      // Populate raw editor
      try {
        rawEditor.value = JSON.stringify(this.data, null, 2);
      } catch (err) {
        rawEditor.value = '';
      }
      this.rawDirty = false;
      rawEditor.classList.add('active');
      treeContainer.style.display = 'none';
      rawError.classList.remove('active');
    }

    this._updateStatus();
  }

  onRawChange() {
    this.rawDirty = true;
    const rawEditor = document.getElementById('rawEditor');
    const rawError = document.getElementById('rawError');

    try {
      JSON.parse(rawEditor.value);
      rawError.classList.remove('active');
      rawError.textContent = '';
    } catch (err) {
      rawError.textContent = `JSON 语法错误: ${err.message}`;
      rawError.classList.add('active');
    }
  }

  /* ---- NEW DOCUMENT ---- */

  newDocument() {
    this._finishEdit();
    this.data = {};
    this.expandedPaths = new Set(['']);
    this.selectedPath = null;
    this.searchTerm = '';
    this.searchMatches = [];
    document.getElementById('searchInput').value = '';
    document.getElementById('searchCount').textContent = '';
    this._resetHistory();
    this.switchView('tree');
    this._render();
    this._updateStatus();
    this._toast('已创建空白文档');
  }

  /* ---- STATUS BAR ---- */

  _updateStatus() {
    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const nodeCount = document.getElementById('nodeCount');
    const cursorPath = document.getElementById('cursorPath');

    if (this.data === null || this.data === undefined) {
      dot.className = 'dot';
      statusText.textContent = '无数据';
      nodeCount.textContent = '';
      cursorPath.textContent = '';
      return;
    }

    dot.className = 'dot';
    statusText.textContent = this.viewMode === 'raw'
      ? (this.rawDirty ? '源文本 (已修改)' : '源文本')
      : '树形视图';

    const count = this._countNodes(this.data);
    const typeLabel = this._getType(this.data) === 'array' ? '数组' : '对象';
    nodeCount.textContent = `${count} 个节点 · ${typeLabel}`;

    if (this.selectedPath) {
      cursorPath.textContent = this._displayPath(this._parsePath(this.selectedPath));
    } else {
      cursorPath.textContent = '';
    }
  }

  _countNodes(value) {
    const type = this._getType(value);
    if (type === 'object' || type === 'array') {
      let count = 1;
      for (const [k, v] of Object.entries(value)) {
        count += this._countNodes(v);
      }
      return count;
    }
    return 1;
  }

  /* ---- TOAST ---- */

  _toast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (isError ? ' error' : '');
    // Force reflow
    toast.offsetHeight;
    toast.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }
}

/* ---- BOOT ---- */
const editor = new JSONEditor();
</script>
