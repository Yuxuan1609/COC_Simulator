<div>
  <div class="flex gap-4 mb-6">
    <button class="px-4 py-1.5 text-sm border border-gray-700 rounded hover:text-aged-gold hover:border-aged-gold bg-[#0f0f0f]"
            hx-get="/launcher/tabs/module-gen" hx-target="#launcher-content" hx-swap="innerHTML">
      模组生成
    </button>
    <button class="px-4 py-1.5 text-sm border border-gray-700 rounded hover:text-aged-gold hover:border-aged-gold bg-[#0f0f0f]"
            hx-get="/launcher/tabs/config" hx-target="#launcher-content" hx-swap="innerHTML">
      参数配置
    </button>
  </div>

  <h2 class="text-xl text-aged-gold mb-4">模组生成向导</h2>

  <form hx-post="/api/pipeline/start" hx-target="#pipeline-progress" hx-swap="innerHTML"
        class="space-y-4 max-w-2xl">
    {# Source document #}
    <div>
      <label class="block text-sm text-gray-300 mb-1">源文档 (.docx / .txt)</label>
      <div class="flex gap-2">
        <input type="text" id="pipeline-source" name="source" placeholder="data/常暗之厢.docx"
               class="flex-1 bg-[#1a150c] border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:border-aged-gold focus:outline-none">
        <button type="button"
                hx-get="/api/files?dir=data&target_input=pipeline-source"
                hx-target="#file-browser-content"
                hx-swap="innerHTML"
                onclick="openFileBrowser()"
                class="px-3 py-1.5 border border-gray-600 rounded text-xs text-gray-400 hover:text-aged-gold hover:border-aged-gold bg-[#1a150c]">
          浏览...
        </button>
      </div>
    </div>

    {# Module name #}
    <div>
      <label class="block text-sm text-gray-300 mb-1">模组名称</label>
      <input type="text" name="module_name" placeholder="例如：常暗之厢"
             class="w-full bg-[#1a150c] border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:border-aged-gold focus:outline-none">
    </div>

    {# Output directory #}
    <div>
      <label class="block text-sm text-gray-300 mb-1">输出目录</label>
      <input type="text" name="output_dir" value="data/modules/"
             class="w-full bg-[#1a150c] border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:border-aged-gold focus:outline-none">
    </div>

    {# Pipeline steps #}
    <div>
      <label class="block text-sm text-gray-300 mb-1">管线步骤</label>
      <select name="start_from" class="bg-[#1a150c] border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200">
        <option value="step_1a">完整生成（从 Step 1a 开始）</option>
        <option value="step_2a">从 Step 2a 续跑</option>
        <option value="step_3a">从 Step 3a 续跑</option>
        <option value="step_3b">仅交叉核对</option>
      </select>
    </div>

    <button type="submit"
            class="px-6 py-2 bg-aged-brown text-parchment rounded hover:bg-[#7a4a2c] text-sm border border-aged-gold/30">
      开始生成
    </button>
  </form>

  <div id="pipeline-progress" class="mt-6"></div>

  {# File browser modal #}
  <div id="file-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center"
       onclick="if(event.target===this)closeFileModal()">
    <div class="bg-[#141414] border border-gray-600 rounded-lg p-4 w-[550px] max-h-[70vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm text-gray-300">选择文件</span>
        <button class="text-gray-400 hover:text-gray-200 text-lg" onclick="closeFileModal()">&times;</button>
      </div>
      <div id="file-browser-content" class="file-listing-container">
        <p class="text-sm text-gray-500">加载中...</p>
      </div>
    </div>
  </div>
</div>
