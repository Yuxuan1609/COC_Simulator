{% extends "base.html" %}
{% block title %}COC 7th — 创建调查员{% endblock %}
{% block body %}
<div class="min-h-screen bg-[#0d0d0d] max-w-3xl mx-auto py-8 px-4">
  <h1 class="text-2xl text-aged-gold text-center tracking-widest border-b border-gray-800 pb-4 mb-6">
    调查员创建
  </h1>

  {# Progress bar #}
  <div class="flex justify-between mb-8 px-8" id="wizard-progress">
    <span id="step-dot-1" class="text-sm px-4 py-1 rounded text-aged-gold bg-aged-brown/20 border border-aged-gold/30">1. 基本信息 & 属性</span>
    <span id="step-dot-2" class="text-sm px-4 py-1 rounded text-gray-600">2. 职业 & 技能</span>
    <span id="step-dot-3" class="text-sm px-4 py-1 rounded text-gray-600">3. 预览 & 导出</span>
  </div>

  {# Step content (loaded via HTMX) #}
  <div id="step-content"
       hx-get="/character/step/1"
       hx-trigger="load"
       hx-swap="innerHTML">
    <p class="text-gray-500 text-sm">加载中...</p>
  </div>
</div>
{% endblock %}
